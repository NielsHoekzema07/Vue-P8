<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d8e2ea">
    <title>Offline</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef3f7;
            --card: rgba(255, 255, 255, 0.82);
            --text: #1f2a37;
            --muted: #5f6b7a;
            --accent: #2f6f8f;
            --shadow: 0 24px 60px rgba(31, 42, 55, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, #ffffff 0%, rgba(255, 255, 255, 0.65) 28%, transparent 56%),
                linear-gradient(180deg, #f4f8fb 0%, var(--bg) 100%);
        }

        .card {
            width: min(920px, 100%);
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            overflow: hidden;
            border-radius: 28px;
            background: var(--card);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .content {
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            display: inline-block;
            width: fit-content;
            margin-bottom: 16px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(47, 111, 143, 0.1);
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1.05;
        }

        p {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--muted);
            max-width: 34ch;
        }

        .note {
            margin-top: 24px;
            padding-left: 14px;
            border-left: 4px solid rgba(47, 111, 143, 0.25);
            font-size: 0.98rem;
        }

        /* Images removed for offline page */

        @media (max-width: 760px) {
            .card {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 32px;
            }

            /* image-wrap removed */
        }
    </style>
</head>
<body>
    <main class="card">
        <section class="content">
            <span class="eyebrow">Geen verbinding</span>
            <h1>Je bent nu offline</h1>
            <p>
                Geen zorgen. De pagina is nog steeds netjes beschikbaar en je kunt verder zodra je internet weer terug is.
            </p>
            <p class="note">
                Probeer later opnieuw of controleer even je wifi-verbinding.
            </p>
        </section>        
    </main>
</body>
</html>
