    <script>
        const listEl = document.querySelector('.mdc-drawer .mdc-list');
        const topAppBarNavIcon = document.querySelector('.mdc-top-app-bar__navigation-icon');
        const mainContentEl = document.querySelector('.main-content');
        const installSnackbarElement = document.querySelector('.mdc-snackbar');
        const installSnackbarAction = installSnackbarElement.querySelector('.mdc-snackbar__action');
        const installSnackbarDismiss = installSnackbarElement.querySelector('.mdc-snackbar__dismiss');

        //topAppBar
        const topAppBarElement = document.querySelector('.mdc-top-app-bar');
        const topAppBar = new MDCTopAppBar(topAppBarElement);
        //drawer
        const drawerEl = document.querySelector('.mdc-drawer');
        const drawer = MDCDrawer.attachTo(drawerEl);
        //tabbar
        const tabBarEl = document.querySelector('.mdc-tab-bar');
        const tabBar = MDCTabBar.attachTo(tabBarEl);
        //snackbar
        const installSnackbar = new MDCSnackbar(installSnackbarElement);
        installSnackbar.timeoutMs = 10000;

        let deferredInstallPrompt = null;
        let installPromptDelayElapsed = false;
        let installPromptSuppressed = false;
        let installPromptDelayTimer = null;

        function isAppInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function maybeShowInstallSnackbar() {
            if (installPromptSuppressed || isAppInstalled() || !deferredInstallPrompt) {
                return;
            }

            if (!installPromptDelayElapsed || installSnackbar.isOpen) {
                return;
            }

            installSnackbar.open();
        }

        installSnackbarAction.addEventListener('click', async () => {
            if (!deferredInstallPrompt) {
                return;
            }

            deferredInstallPrompt.prompt();
            await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            installPromptSuppressed = true;
            if (installSnackbar.isOpen) {
                installSnackbar.close('action');
            }
        });

        installSnackbarDismiss.addEventListener('click', () => {
            installPromptSuppressed = true;
            if (installSnackbar.isOpen) {
                installSnackbar.close('dismiss');
            }
        });

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredInstallPrompt = event;
            maybeShowInstallSnackbar();
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            installPromptSuppressed = true;
            if (installSnackbar.isOpen) {
                installSnackbar.close('dismiss');
            }
        });

        installPromptDelayTimer = window.setTimeout(() => {
            installPromptDelayElapsed = true;
            maybeShowInstallSnackbar();
        }, 2000);

        // open menu
        topAppBarNavIcon.addEventListener('click', () => {
            drawer.open = true;
        });

        //sluit menu
        listEl.addEventListener('click', (event) => {
            drawer.open = false;
        });

        document.querySelector('.mdc-top-app-bar__title').addEventListener('click', () => {
            //alert('Je hebt op de titel geklikt!');
            filterImages('all'); // Toont alle afbeeldingen
            tabBar.activateTab(null); //deactiveert alle tabs

            //tabBar.deactivateTabAtIndex(0)
        });

        function filterImages(category) {
            const images = document.querySelectorAll('.mdc-image-list__item');
            images.forEach(image => {
                if (category === 'all' || image.classList.contains(category)) {
                    image.classList.remove('hidden');
                } else {
                    image.classList.add('hidden');
                }
            });
        }

        const imageList = document.querySelector('.mdc-image-list');
        imageList.addEventListener('click', (event) => {
            const clickedImage = event.target.closest('.mdc-image-list__item');
            if (clickedImage) {
                const imgElement = clickedImage.querySelector('.mdc-image-list__image');
                openSheet(imgElement.src, imgElement.alt);
            }
        });

        function openSheet(imageSrc, title, fromPopState = false) {
            const sheet = document.querySelector('.sheet');
            const isSheetOpen = !sheet.classList.contains('sheet-out-of-view');
            sheet.querySelector('main img').src = imageSrc;
            sheet.querySelector('.mdc-top-app-bar__title').textContent = title;
            sheet.classList.remove('sheet-out-of-view');
            document.body.style.overflow = 'hidden';
            if (!fromPopState && !isSheetOpen) {
                history.pushState({ sheetOpen: true, imageSrc, title }, '');
            }
        }

        function closeSheet(fromPopState = false) {
            const sheet = document.querySelector('.sheet');
            if (sheet.classList.contains('sheet-out-of-view')) return;
            const imgElement = sheet.querySelector('main img');
            const title = sheet.querySelector('.mdc-top-app-bar__title').textContent;
            sheet.classList.add('sheet-out-of-view');
            document.body.style.overflow = 'auto';
            if (!fromPopState) {
                history.pushState({ sheetOpen: false, imageSrc: imgElement.src, title }, '');
            }
        }

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.sheetOpen) {
                openSheet(event.state.imageSrc, event.state.title, true);
            } else {
                closeSheet(true);
            }
        });

    </script>
